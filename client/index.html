<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Watch — SCOM Dashboard</title>
    <script>
      // Applied before React mounts (and before the stylesheet's first
      // paint) so switching themes doesn't flash the old one on reload.
      try {
        var t = localStorage.getItem('server-watch-theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
